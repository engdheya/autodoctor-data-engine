# مسرد المصطلحات العربية الموحّد — يُستخدم في كل مسوّدات الترجمة.
#
# القاعدة: المصطلح التقني القياسي يبقى بالإنجليزية داخل النص العربي (ECU، CAN، ABS،
# limp mode، DTC) لأن الفني العربي يستخدمه بهذه الصورة، وما له مقابل عربي راسخ
# يُترجم ويُذكر أصله الإنجليزي بين قوسين عند أول ورود.
