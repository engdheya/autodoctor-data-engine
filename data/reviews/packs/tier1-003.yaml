      position. These codes report the deviation with its direction: "too low" means the meter measures
      less air than expected, "too high" more. Regulations allow manufacturers to use one code for both
      directions or separate codes, as here. P00BC concerns air flow meter A. Typical causes are air entering
      behind the meter, a charge-air leak, a dirty meter or a restricted intake. No manufacturer description
