  english:
    title_en: Throttle/Pedal Position Sensor/Switch E Circuit Intermittent
    description_en: 'P2129 is meant for short dropouts or spikes in signal circuit E that do not last
      long enough for a steady low or high fault. No manufacturer documents this code publicly. GM and
      Ford, which assign E to the second pedal sensor, catch such glitches inside their circuit codes
      instead: GM counts failures every 12.5 ms and flags the APP sensor 2 circuit after 19 of 39 counts
      (P2125/P2127/P2128), Ford uses 0.25/4.75 V limits. CARB requires circuit monitoring of input sensors;
      the code fits that duty. Check for loose pins and harness chafing with the pedal moved slowly. Effects
      range from a warning lamp to brief power cuts while driving.'
    verification_status: verified
    sources: &id031
