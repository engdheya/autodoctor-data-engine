    title_en: Internal Control Module Accelerator Pedal Position Performance
    description_en: 'The accelerator pedal has two sensor tracks. With P060D the module''s own cross-check
      of the pedal value fails: two processors (GM: main and ''motor'' processor) calculate pedal position
      independently and must agree, and an active test briefly pulls one track to ground – the other must
      not follow, otherwise the tracks are shorted together. Thresholds: GM 2005 difference over 0.142
      V or track 2 over 2.05 V during the test; GM 2006 over 5 %; Ford diesel compares track 1 against
      twice track 2 (half slope), fault above 547 or 1055 mV for 5 s. GM sets it in the first trip, Ford
      since 2020 with the check engine and wrench lamps (2012 only the wrench lamp). Unlike P2138, where
      the two pedal tracks disagree outside the module, P060D is the internal plausibility check.'
    verification_status: verified
