      channels shows up. It feeds brake assist and regenerative blending; CARB requires inputs used by
      other diagnoses to be monitored. A channel fault blocks the A/B correlation P05E0 and usually limits
      brake assist or regeneration. P05DB is the general circuit or open-circuit fault of channel B. Toyota's
      electronically controlled brake (RAV4 Hybrid 2024–25) reports channel B faults under it; while it
      is stored, the A/B correlation does not run.
