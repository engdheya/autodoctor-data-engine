  english:
    title_en: Auto Configuration Throttle Input Not Present Bank 1
    description_en: Some modules configure themselves at start-up by detecting which inputs are present.
      P063E means the module expects a throttle position input for bank 1 but does not detect it. Unlike
      circuit codes such as P0122/P0123 or P2135, which judge a present but faulty signal, this says the
      input was not found for the configuration. No manufacturer document or patent available to us describes
      this check; the explanation is derived from the J2012 wording. CARB requires input components to
      be checked for circuit continuity and plausibility, and modules with several variants to detect
      a wrong one. Possible causes are an unplugged throttle body or open wiring, or software meant for
      a different vehicle. Without a throttle signal an electronic throttle runs in limp mode.
    verification_status: verified
    sources: &id017
    - obdex
