    description_en: 'The manifold absolute pressure (MAP) sensor measures the pressure behind the throttle;
      on vehicles without a separate barometric sensor it also supplies the ambient pressure, read at
      key-on or wide-open throttle – hence ''MAP/BARO''. It is a three-wire sensor with 5 V reference,
      ground and signal. P0106 is a plausibility fault: the signal is electrically valid but implausible
      – stuck, offset or drifting. Two tests are common. With the engine stopped, all pressures equalise,
      so MAP must match ambient (and boost) pressure; Ford allows 1.5–3 inHg. While running, MAP is compared
      with a value modelled from air mass, throttle and speed – GM blames the MAP sensor above about 23–30
      kPa error, with two trips on petrol and one on diesel. Turbo engines with three sensors find the
      odd one out by majority. Besides the sensor, intake or boost leaks often cause it.'
