    description_en: 'The manifold absolute pressure (MAP) sensor measures the pressure behind the throttle;
      on vehicles without a separate barometric sensor it also supplies the ambient pressure, read at
      key-on or wide-open throttle – hence ''MAP/BARO''. It is a three-wire sensor with 5 V reference,
      ground and signal. P0105 is the general circuit fault and is rarely used today: most petrol engines
      report low, high and intermittent separately (P0107–P0109). It appears mainly where the fault cannot
      be broken down further – Ford''s 2023 diesels set it when the digital SENT sensor reports a bad
      status or an out-of-limit value for 5 s (lost communication is a separate U code), and Bosch EDC16
      diesels use it with a fault type byte, for example signal below 0.2 V. Saab then substitutes 101.3
      kPa, limits torque and switches off EGR and boost control.'
