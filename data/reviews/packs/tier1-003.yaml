  english:
    title_en: Throttle Actuator Control Range/Performance Bank 2
    description_en: 'P0639 is the bank 2 counterpart of P0638 and only applies to engines with two separate
      electronic throttles, one per cylinder bank (some V8, V10 and V12 engines with separate intake paths).
      The module compares target and actual angle and the duty cycle the motor needs; if the plate does
      not follow, it is de-energised and springs to its rest position, and power is limited. No manufacturer
      document available to us uses P0639 – this follows P0638 (Subaru: more than 3.5° deviation for 250
      ms) and CARB''s function check of output components. Ford calls a second throttle ''throttle actuator
      B'' and reports it as P211A ff, its sensors as sensor C (P0225/P0229). Uneven filling of the two
      banks can also cause a rough idle.'
