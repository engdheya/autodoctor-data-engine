  english:
    title_en: Invalid Data Received From Throttle Actuator Control Module
    description_en: 'U0408 points to messages from the throttle actuator control module that the receiver,
      usually the ECM/PCM, judges invalid: implausible content, a failed checksum or counter, or a value
      outside its range. Most vehicles integrate throttle control in the engine controller, so a separate
      TAC module and therefore this code are uncommon; no manufacturer documents U0408 publicly. Ford''s
      2012 OBD summary illustrates the U04xx logic with U0401, which the TCM stores when ECM torque or
      pedal data are faulted. Because the throttle meters intake air, CARB''s comprehensive component
      rules apply, and a MIL together with reduced power or a limp mode is likely. U0107 means lost contact,
      U0308 a software mismatch with the same module.'
