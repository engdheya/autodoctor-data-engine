      the sensor 2 circuit with a counter at 12.5 ms per count (19 of 39 counts). In GM''s 2006 tables
      sensor 2 is valid between about 0.16 and 2.3 V. GM bulletin 14636 lists P2125 among the pedal codes
      caused by a broken solder joint inside the pedal (2009-2011 Impala, LaCrosse). Range/Performance
      is P2126, explicit low or high voltage P2127/P2128, dropouts P2129, and the D/E comparison P2138.
