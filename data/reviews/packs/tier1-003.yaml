      سرعة السيارة، ويتأثر عمل النقل والتحكم.

      '
    context_ar: 'سياق المصدر: Saturn، Ford، GM — وردت هذه التفاصيل أعلاه في المصدر ضمن وصف يخص هذه الشركات
      تحديدًا، ولا تُعمَّم على غيرها.'
