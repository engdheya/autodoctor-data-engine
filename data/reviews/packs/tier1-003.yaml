      code P2135). GM and Ford give the pedal sensors their own codes (P2120 ff), so B is in practice
      the second throttle sensor. P0220 is the general circuit fault of sensor B without telling low from
      high. GM uses it in a special sense on 2015–2016 V8 engines: the signal lies outside 0.25–4.59 V
      only in the monitoring processor while the main processor sees it as valid; this sets immediately
      with the warning light. Newer GM and Ford engines report sensor B faults as P0222/P0223. The module
      carries on with sensor A, limits throttle opening and power and switches off cruise control.'
