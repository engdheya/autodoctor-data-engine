  english:
    title_en: Manifold Absolute Pressure/Barometric Pressure Sensor Circuit Low
    description_en: 'The manifold absolute pressure (MAP) sensor measures the pressure behind the throttle;
      on vehicles without a separate barometric sensor it also supplies the ambient pressure, read at
      key-on or wide-open throttle – hence ''MAP/BARO''. It is a three-wire sensor with 5 V reference,
      ground and signal. P0107 means the signal voltage is below its lower limit. ''Low'' refers to the
      voltage, not to a real low pressure: typically the signal wire is grounded, the signal or 5 V reference
      is open, or the sensor has failed. A short on another sensor sharing the same reference can pull
      it down too, so GM often sees several codes at once. Documented limits: GM below 3.3 % of 5 V (about
      0.17 V), GM/Saab 2.0T below 0.19 V for 4 s, Ford petrol below 0.19 V for 5 s, Ford diesel below
      0.1 V. GM petrol needs two trips, GM diesel one. A modelled value replaces the reading.'
