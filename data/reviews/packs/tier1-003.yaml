  english:
    title_en: Software Incompatibility With Throttle Actuator Control Module
    description_en: 'U0308 flags that the throttle actuator control module carries software or a calibration
      that the engine controller does not accept. In most current cars throttle control lives inside the
      ECM/PCM, so a separate TAC module and this code are rare; no manufacturer documents U0308 publicly.
      Ford shows how such a mismatch is handled when the logic is integrated: its 2012 OBD summary files
      a software version mismatch between the electronic-throttle processors under U0300, non-MIL on Gen2
      and MIL on Gen3/Gen4 throttle systems. GM''s U03xx procedure links these codes to a module that
      was not configured after installation. Throttle control affects emissions, so CARB demands monitoring
      and a MIL is likely. U0107 means lost contact, U0408 invalid data.'
