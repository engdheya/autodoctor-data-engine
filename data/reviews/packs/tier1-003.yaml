    title_en: Diesel Intake Air Flow Position Sensor Minimum/Maximum Stop Performance
    description_en: The diesel intake throttle learns the position sensor values of its end stops, as
      a Toyota patent describes for the closed stop at engine stop. P02FA means a learned end-stop value
      is implausible. Ford's 6.7 and 3.0 diesels check it once after each learning run and set the code
      when the learned minimum offset is outside ±10 (6.7) or ±6.7 (3.0) – Ford only evaluates the minimum
      stop. Typical causes are soot and oil deposits at the flap and stop, a worn or shifted sensor, mechanical
      damage or a replacement part that has not been learned. EGR control may be restricted.
