  english:
    title_en: MAP/MAF - Throttle Position Correlation
    description_en: The engine control module compares the air quantity measured by the manifold pressure
      and/or mass air flow sensor with the quantity the throttle position leads it to expect. P0068 is
      set when they do not match, typically because more air arrives than the nearly closed throttle allows,
      i.e. an air leak behind the throttle, or because the throttle body is dirty or a sensor reads wrong.
      On engines with electronic throttle this check protects throttle control, so the engine often goes
      into reduced power. Each sensor can be electrically fine on its own; regulations require such plausibility
      checks for input sensors with a code of their own.
