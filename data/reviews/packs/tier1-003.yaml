    description_en: 'The brake pedal position sensor A is an analogue 5 V sensor giving pedal travel continuously;
      its rest position (about 1 V) is learned. GM reads it in the engine module from about 2012 and uses
      it as an enabling condition of transmission monitors – hence type A, warning lamp after one trip,
      unlike cruise control codes. On any circuit fault GM sets the pedal to 0 %, so brake detection relies
      on the brake light switch. P057C means the signal is too low – a short to ground: GM below 5 in
      20 of 32 samples. GM bulletins for 2012–14 pick-ups and SUVs name connector X205 under the left
      defroster duct, with cruise, brake light and stability messages and reduced power.'
