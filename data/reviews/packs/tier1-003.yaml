    description_en: 'This code reports that position signal C does not show a believable value while its
      throttle or pedal sits on the lower stop. The controller learns or expects a minimum reading within
      a tolerance band and flags a fault when the learned value falls outside it. Letter C is rarely assigned:
      Ford and GM use A/B for the throttle and D/E/F for the pedal, so C appears only on layouts with
      a third sensor. No manufacturer documents this code publicly; the logic follows the A version P2109
      (Subaru) and the Delphi minimum-learn patent. P2113 and P2115-P2117 are the same test for other
      letters, P2136/P2137 compare C against A or B. Expect a warning lamp and possibly limited power.'
