      code P2135). GM and Ford give the pedal sensors their own codes (P2120 ff), so B is in practice
      the second throttle sensor. P0222 means the signal of sensor B is below its lower limit – GM about
      0.25 V, Ford below 0.25 V – typically a short to ground, an open signal wire or a missing 5 V reference.
      Both detect it within about a second and switch the warning light on in the first trip. If the shared
      reference fails, several sensors report low at once. The module carries on with sensor A, limits
