name: autodoctor_app
description: "AutoDoctor AI - offline vehicle diagnostics on top of the AutoDoctor data engine bundle."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # storage: reference bundle (read-only) + user database (read-write)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # integrity + formatting
  crypto: ^3.0.5
  convert: ^3.1.1
  intl: ^0.19.0

  # deliberately absent for now: dio (no network calls yet), flutter_secure_storage
  # (nothing secret stored yet), freezed/json_serializable (entities are plain immutable
  # classes until a serialisation format actually exists). See docs/FLUTTER_PHASE1.md.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/db_manifest.json
    - assets/db/autodoctor-app-0.9.1-public.sqlite
