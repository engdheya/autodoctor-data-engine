  english:
    title_en: Transmission Park Position Sensor/Switch A Circuit Performance/Low
    description_en: 'P07B5 means something different at each manufacturer. At GM it covers the P button
      of the shift-by-wire selector: sensor A reads in the band between its ''released'' and ''pressed''
      zones (53.2–73.7 % of 5 V, ICCM 45–58 %), after two trips. On the Chrysler Pacifica plug-in hybrid
      it is the park pawl position sensor 1 in the transmission, fixed by software together with park
      actuator codes. On the 2017–18 Genesis G80/G90 it reads ''park position sensor circuit low'' and
      the park position switch is replaced. In all cases the module cannot reliably determine the park
      request or position.'
    verification_status: verified
    sources:
