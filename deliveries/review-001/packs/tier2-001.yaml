  english:
    title_en: Fuel Temperature Too High
    description_en: 'P0168 is not a sensor fault but an operating condition, almost only on diesels: the
      fuel temperature sensor reports fuel hotter than a protective limit. The fuel heats up through the
      return flow from the high-pressure pump and injectors, especially with little fuel in the tank,
      at idle after full load, in hot weather or with a failed fuel cooler; one manufacturer patent names
      about 80 °C as the upper limit to protect seals, against a normal range of roughly 5–60 °C. On Saab''s
      Bosch EDC16 diesels the code means an engine protection function is active and injection quantity
      is reduced. No manufacturer threshold was found, and GM''s and Ford''s diesel summaries do not use
      P0168. Whether the warning light comes on depends on the manufacturer.'
