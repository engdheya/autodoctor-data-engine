  english:
    title_en: System Too Lean Bank 1
    description_en: 'With closed-loop control the engine module corrects the injected fuel using the oxygen
      sensor: short-term fuel trim reacts within fractions of a second, long-term trim stores a learned
      base correction per load and speed range. Positive values mean fuel is being added because the mixture
      was lean, negative values mean fuel is being removed; around ±10 % is normal. P0171 means long-term
      trim on bank 1 is at its upper limit: the module already adds the maximum fuel and the mixture still
      stays lean. GM sets it at a long-term factor of about 1.30–1.36 (+30–36 %, engine-specific), Ford
      above +25 % with short-term trim above +1 %; it needs two trips and is suspended during heavy purge
      flow or intrusive tests. GM bulletins repeatedly trace it to leaking crankcase ventilation hoses
      or pipes on V6 and V8 engines; Ford found leaking direct injectors. P0171 together with P0174 points
      to a shared cause. Diagnosis hint: trims very high only at idle and normal under load point to an
      air leak; trims rising with load point to fuel shortage or an air flow sensor reading low. The oxygen
      sensor only reports what is in the exhaust and is rarely the cause.'
    verification_status: verified
    sources:
    - obdex
