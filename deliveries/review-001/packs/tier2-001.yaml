  english:
    title_en: EVAP System Leak Detected (small leak)
    description_en: 'The evaporative emission (EVAP) system stores fuel vapour from the tank in a charcoal
      canister; a purge valve lets the engine draw it off, and a vent valve opens the canister to fresh
      air. P0442 reports a small leak; what size that means depends on the maker. Ford detects 0.040 in
      (1 mm) with the engine running: the vent valve closes, engine vacuum pulls the tank down, the purge
      valve closes and a pressure rise above 2.5 inH2O in 15 s sets the code (0.020 in is P0456). GM uses
      the natural pressure change after switch-off for 0.020 in and averages several tests. Pump systems
      at VW and Audi compare against a reference leak. A worn or loose fuel cap is the most common cause.'
    verification_status: verified
    sources:
    - obdex
