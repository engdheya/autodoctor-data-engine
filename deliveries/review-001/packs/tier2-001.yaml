  - 2 independent source(s) state this code
  - 4 cause statement(s) available for review
  english:
    title_en: Engine Oil Pressure Control Circuit Low
    description_en: A switchable or variable oil pump saves fuel by lowering its output at part load;
      a solenoid valve sets the stage. GM and Ford design it so the pump runs at full output, i.e. high
      pressure, when the valve is unpowered – the safe default – and at the low stage when powered. P06DB
      means the control wire behind the valve is shorted to ground. With a low-side driver the valve is
      then powered all the time, so the pump stays at the low stage even at high load and speed. That
      endangers the engine, so GM flags a short below 0.5 Ω after just one trip, unlike open circuit and
      short to positive. GM checks the low-side driver at 11 V or more relay voltage over 40 of 50 samples
      (100 ms); Ford's smart driver reports output faults after 5 s with the battery at 11 V or more.
      A short to positive is P06DC, a pump stuck at low pressure without a circuit fault P06DE.
    verification_status: verified
    sources:
    - obdex
