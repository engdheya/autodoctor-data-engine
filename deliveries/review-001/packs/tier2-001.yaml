  english:
    title_en: Engine Oil Pressure Control Circuit Stuck On
    description_en: 'A switchable oil pump changes its output via a solenoid valve; powered it runs at
      the low stage. To test it, the module switches the pump between stages (GM up to 15 times, with
      oil at 50–110 °C and 1350–2500 rpm, expecting more than 100 kPa difference) and watches the oil
      pressure sensor; Ford checks each switch-over of a two-stage pump within 1 s, or a variable pump
      over 10 s, from 30 s after start. P06DE is the counterpart of P06DD: the commanded high stage is
      not reached and the pressure stays below the threshold, as if the valve were stuck on. Too little
      oil pressure at high load endangers the engine, so GM sets it after just one trip; a Ford patent
      raises idle speed in this case. A short to ground on the control wire (P06DB) has the same effect
      electrically. An FCA bulletin for the 3.6 L V6 fixes false codes by software.'
    verification_status: verified
    sources:
