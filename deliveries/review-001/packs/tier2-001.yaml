  english:
    title_en: Engine Coolant Over Temperature Condition
    description_en: 'P0217 is a condition code: the engine module reports that coolant temperature has
      passed a protection threshold. The limit and the reaction depend on the manufacturer – Saab''s 2.2
      diesel sets it at 120 °C for over 10 s, limits fuel quantity and suspends EGR and boost diagnostics
      until the temperature drops; heavy-duty diesels cut power sharply and may shut down; Ford petrol
      engines use their own code P1299 and cut fuel to individual cylinders. Whether the warning light
      comes on varies, because CARB exempts overheat protection that only engages once the gauge reads
      red. Usual causes are low coolant, a thermostat stuck closed, a failed fan or water pump – but Ford
      traced some cases to a faulty coolant sensor or harness.'
