  english:
    title_en: Transmission Park Position Sensor/Switch A Circuit/Open
    description_en: 'With electronic gear selection the park position sensor/switch reports the park request
      or position. On GM''s shift-by-wire selectors (2017 LaCrosse, XT4/XT5, Bolt EV, later SUVs and pickups)
      it is the P button, read by two redundant analog sensors A and B with separate ''released'' and
      ''pressed'' voltage zones. P07B2 means the circuit of sensor A is open: the module sees a missing
      or undefined signal. No manufacturer document available to us uses this code; GM covers an open
      analog circuit under its low and high codes (P07B3/P07B4), which CARB allows when an open cannot
      be told apart from an out-of-range value. Park may then not be selectable by button.'
    verification_status: verified
    sources:
