  english:
    title_en: Transmission Fluid Temperature Sensor A Circuit
    description_en: 'The transmission fluid temperature sensor is an NTC thermistor whose resistance falls
      as the fluid warms; the module feeds it with 5 V through a resistor. A low signal therefore means
      very hot or a short to ground, a high signal very cold or an open circuit. P0710 is the general
      circuit code used when a manufacturer does not separate low and high. Subaru-based systems (Saab
      9-2X) flag 0.1 V or less or 4.7 V or more, light the MIL after two consecutive trips and use 80
      °C as substitute. Ford''s 2023 diesels use P0710 alongside P0712/P0713 for open and short circuits,
      without MIL, after 5–12 s, substituting coolant temperature. GM uses only the split codes. With
      the substitute value the shift quality suffers: harsh shifts and a late converter clutch.'
    verification_status: verified
    sources:
    - obdex
