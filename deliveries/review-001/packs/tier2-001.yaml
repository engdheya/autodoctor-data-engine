  english:
    title_en: Stuck in Neutral
    description_en: 'Ford''s DPS6 dry dual-clutch transmission moves its gears with two electrically driven
      shift drums whose position is read by Hall sensors: drum A shifts 1st, 3rd and 5th, drum B reverse,
      2nd, 4th and 6th. Ford''s 2012 summary lists ''stuck in gear'' codes for each drum: the module commands
      the drum out of a gear, but the gear stays engaged. It gives no thresholds or MIL rating. P072A
      means the transmission stays in neutral although a gear is commanded – no drive. No manufacturer
      document available to us uses this code; the DPS6 reports drum position faults under its own codes.
      On dual-clutch or automated manuals a drum or fork would fail to engage a gear, on planetary automatics
      clutch pressure would be missing. The opposite is P073D.'
    verification_status: verified
    sources:
    - obdex
  arabic_draft:
