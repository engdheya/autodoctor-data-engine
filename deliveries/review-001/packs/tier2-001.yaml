  english:
    title_en: Transmission Park Position Sensor/Switch A Circuit Performance High
    description_en: With electronic gear selection the park position sensor/switch reports the park request
      or position. On GM's shift-by-wire selectors (2017 LaCrosse, XT4/XT5, Bolt EV, later SUVs and pickups)
      it is the P button, read by two redundant analog sensors A and B with separate 'released' and 'pressed'
      voltage zones. P07B6 is the 'high' side of the plausibility check of sensor A. No manufacturer document
      available to us uses this code; GM covers the band between its zones with one code (P07B5); CARB
      does not require separate codes for each side of a two-sided plausibility check. Park request or
      position is then unreliable.
    verification_status: verified
    sources:
    - obdex
