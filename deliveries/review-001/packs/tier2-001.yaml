      check three things: the fluid does not warm up as expected (GM 2025 still below 15 °C after the
      calibrated warm-up time, Saab''s AF40 below 20 °C after 10 minutes of driving), the value is stuck
      (Ford: within ±2 °F for about 2.5 minutes below 70 or above 225 °F), or it jumps unrealistically.
      GM''s 6T70 compares it with the module''s internal temperature. The MIL rating varies: GM''s newer
      modules after two trips, Saab AF40 none, Ford none; a 2013 Ram 6.7 bulletin moved P0711–P0714 from
      one to two trips. A substitute value then limits adaption and converter clutch control.'
