      sensor tracks, and the module checks whether it can still detect a short between them: during an
      active test one track is influenced briefly, and the second processor (GM ''motor processor'') confirms
      that the test actually ran. GM 2005 sets the code when track 2 exceeds 1.75 V during the test or
      no test activity is seen for 500 ms, GM 2006 at 2.05 V or 498 ms, each after two counts of about
      155 ms, with the lamp in the first trip; GM Europe rates it type C with reduced power. Ford does
      not use P060E. The throttle opening is limited or set to its default position. External disagreement
      between the two tracks is P2135; circuit faults of single tracks are P0120–P0123 and P0220–P0223.'
