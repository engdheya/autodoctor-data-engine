      bring the plate into its default (limp) position, e.g. 1.32-1.90 V on TP sensor 1 in GM''s 2006
      tables; 15 failed samples in a row set it. A Bosch-based GM ECM times the spring return at key-on
      (fault above 0.56 s). Toyota, Lexus, Ford (Ranger/Bronco, ice behind the throttle) and Mitsubishi
      use the code too. Unlike P2101 (position error while driven) or P2118 (motor current), P2119 points
