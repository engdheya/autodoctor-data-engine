  english:
    title_en: EGR Throttle Control Circuit A/Open
    description_en: 'Exhaust gas recirculation (EGR) routes part of the exhaust back into the intake to
      lower combustion temperature and NOx. The EGR throttle is a regulating flap ahead of the intake
      manifold on diesels: by closing partly it lowers manifold pressure below exhaust back pressure so
      that enough exhaust is recirculated, and it also helps filter regeneration and shuts off air at
      engine stop. It is usually a DC motor with position sensor. GM and Ford report this flap under P02E0
      ff; no manufacturer document available to us uses this code. P0487 means its drive circuit is open
      or has a general circuit fault, detected by the output stage. The flap then stays open, so the EGR
      rate cannot be raised enough and filter regeneration may be blocked.'
    verification_status: verified
    sources:
    - obdex
  arabic_draft:
    title_ar: دائرة التحكم في خانق EGR — القناة A — قطع
    description_ar: 'إعادة تدوير غاز العادم (EGR) تعيد جزءًا من العادم إلى مجرى السحب لخفض حرارة الاحتراق
      وNOx. خانق EGR صفيحة تنظيم أمام مجرى السحب في محركات الديزل، والكود يعني قطعًا أو فتحًا في دائرة
