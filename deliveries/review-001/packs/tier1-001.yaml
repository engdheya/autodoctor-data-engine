  english:
    title_en: Vehicle Speed Sensor A Circuit Range/Performance
    description_en: 'The vehicle speed signal A comes, depending on the maker, from a sensor on the gearbox,
      the transmission output speed, the wheel speeds via ABS/ESP or a CAN message; CARB explicitly names
      it as an input to be monitored. P0501 means the signal is present but does not fit the driving state
      or lies outside the physically possible range. Saab''s Trionic T5 sets it above 270 km/h; other
      makers typically compare it with engine speed times gear ratio, wheel speeds or the transmission
      output speed. GM''s 2018 tables and Ford do not use P0501 (GM: P0503, Ford: P0500). Cruise control
      is then disabled.'
