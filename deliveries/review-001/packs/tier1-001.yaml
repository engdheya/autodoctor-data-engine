  english:
    title_en: Vehicle Speed Sensor A Circuit
    description_en: 'The vehicle speed signal A comes, depending on the maker, from a sensor on the gearbox,
      the transmission output speed, the wheel speeds via ABS/ESP or a CAN message; CARB explicitly names
      it as an input to be monitored. P0500 is the general code for this signal. Ford checks plausibility:
      the car must be moving (high load, positive torque), yet the signal stays below 1–5 mph for 5 s;
      Ford diesels flag a missing CAN message after 0.5 s. GM''s Saturn ION of 2004 used high load with
      below 3 mph for 6.2 s (MIL after two trips); GM''s 2018 tables use P0502/P0503 instead. Cruise control
      is then disabled and substitute values are used.'
    verification_status: verified
    sources:
    - obdex
  arabic_draft:
    title_ar: دائرة حساس سرعة السيارة A
    description_ar: 'إشارة سرعة السيارة A تأتي — بحسب الشركة — من حساس على ناقل الحركة، أو من سرعة خرج
      ناقل الحركة، أو من سرعات العجلات عبر ABS/ESP، أو عبر رسالة CAN. عند انقطاعها لا تعرف وحدة التحكم
      سرعة السيارة، ويتأثر عمل النقل والتحكم.

      '
    translator: null
    reviewer: null
