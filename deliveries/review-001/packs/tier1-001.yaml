  english:
    title_en: Throttle/Pedal Position Sensor B Minimum Stop Performance
    description_en: The engine computer checks whether position signal B reports a plausible value when
      the throttle or pedal rests against its lower mechanical stop. At key-on many systems learn this
      minimum and compare it with a tolerance window; a reading outside that window sets the code. Ford
      and GM label their second throttle position sensor as B, so on those layouts B means the throttle
      body, but neither maker publishes P2113 itself. No manufacturer documents this code publicly; Subaru
      uses the A version (P2109). Ice, coking or a bent stop are typical triggers. P0220-P0223 cover the
      B circuit, P2109 and P2114-P2117 the other letters. The driver may see a warning lamp and reduced
      power.
    verification_status: verified
    sources:
    - obdex
