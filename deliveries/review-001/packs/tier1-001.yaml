    description_en: 'The electronic throttle motor positions the throttle plate; P0638 means the actuator
      does not follow its command on bank 1 (or the only throttle): target and actual angle from the two
      position sensors differ, or the motor needs too much duty cycle to hold the position. Subaru (also
      sold as Saab 9-2X) sets it at more than 3.5° deviation for 250 ms or over 95 % duty cycle for 2
      s, lights the lamp at once and lets the spring set the plate to about 6° – raised idle, almost no
      power. GM''s Saab 9-4X V6 uses more than 80 % duty cycle for over 1 s, lamp in the first trip. Mazda''s
      CX-9 set it after frosty nights when condensation froze the throttle and fixed it with software
      that moves the plate after switch-off. Ford reports the same function as P2111/P2112.'
    verification_status: verified
