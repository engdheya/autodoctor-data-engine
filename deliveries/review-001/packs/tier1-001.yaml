  english:
    title_en: Internal Control Module Throttle Actuator Controller Performance
    description_en: 'P061F monitors the throttle position controller inside the engine module and its
      communication with the main processor. At Ford the main processor sends the target throttle angle
      to this controller (generation 2: a 312.5 Hz duty cycle signal, 10–92 % for 0–82°), which drives
      the throttle motor via an H-bridge; the monitoring checks that the target is implemented and reported
      back correctly. Ford 2012 sets it within 1 s – with the check engine light on generation 2 (2003–2007,
      separate controller chip), without it on generations 3/4 where the controller is integrated. A fault
      puts the throttle into its default position with an RPM limit. Ford 2020–23 no longer uses P061F
      (throttle controller faults run under P2107 ff). No other manufacturer document available to us
      uses it. Throttle motor circuit and function codes are P2100–P2112.'
    verification_status: verified
