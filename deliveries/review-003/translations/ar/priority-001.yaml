# مسوّدات آلية لمجموعة الأولوية الأولى (أكواد السلامة) — ليست محتوى معتمدًا.
#
# كل مدخل هنا `reviewed: false` و`translator` فارغ، لذلك يتجاهله build-db ويظهر
# في التقرير كمسوّدة. لا يُعرض للمستخدم داخل التطبيق قبل أن يوقّعه مترجم ومراجع
# بشريان (reviewer + reviewed: true).
#
# المصطلحات التقنية تُركت بالإنجليزية عمدًا: ECU، CAN، ABS/ESP، EGR، TAC، limp mode.

- code: P0500
  context:
    type: generic
  title: "دائرة حساس سرعة السيارة A"
  description: >
    إشارة سرعة السيارة A تأتي — بحسب الشركة — من حساس على ناقل الحركة، أو من
    سرعة خرج ناقل الحركة، أو من سرعات العجلات عبر ABS/ESP، أو عبر رسالة CAN.
    عند انقطاعها لا تعرف وحدة التحكم سرعة السيارة، ويتأثر عمل النقل والتحكم.
  translator: ""
  reviewer: ""
  reviewed: false
  context_ar: "سياق المصدر: Saturn، Ford، GM — وردت هذه التفاصيل أعلاه في المصدر ضمن وصف يخص هذه الشركات تحديدًا، ولا تُعمَّم على غيرها."
  source_url: "https://github.com/foerbsnavi/OBDex"

- code: P0501
