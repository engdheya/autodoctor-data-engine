    type: generic
  title: "دائرة حساس سرعة السيارة A — المدى والأداء"
  description: >
    الإشارة موجودة لكن قيمتها خارج المدى المتوقع أو غير متسقة مع مصادر السرعة
    الأخرى (حساس ناقل الحركة أو سرعات العجلات عبر ABS/ESP أو CAN).
  translator: ""
  reviewer: ""
  reviewed: false
  context_ar: "سياق المصدر: Ford، GM — وردت هذه التفاصيل أعلاه في المصدر ضمن وصف يخص هذه الشركات تحديدًا، ولا تُعمَّم على غيرها.؛ قيم المصدر المنقولة: 270km/h (تبقى مرتبطة بسياق المصدر ولا تُعمَّم)."
  source_url: "https://github.com/foerbsnavi/OBDex"

- code: U0107
  context:
    type: generic
  title: "انقطاع الاتصال بوحدة التحكم في مشغّل الخانق (TAC)"
  description: >
    توقفت وحدة التحكم في مشغّل الخانق عن الإرسال على ناقل بيانات السيارة، فلا
    تتلقى الوحدات الأخرى رسائلها. قد ينتقل التحكم الإلكتروني في الخانق إلى
    limp mode بقدرة منخفضة جدًا.
  translator: ""
  reviewer: ""
  reviewed: false
  source_url: "https://github.com/foerbsnavi/OBDex"

