name: Upstream drift

# Weekly check that the pinned upstream projects are still there and still
# shaped the way the connectors expect. It never imports the full corpus: it
# inspects the layout and imports a small slice, which is enough to catch a
# moved directory, a renamed table or a structural YAML change.

on:
  schedule:
    - cron: "0 4 * * 1"     # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: autodoctor fetch-sources --all || true

      - name: Inspect layouts
        run: autodoctor inspect-sources | tee inspection.txt

      - name: Smoke import (bounded)
        run: |
          for source in obdex wal33d autodiag obdb; do
            autodoctor import --source "$source" --limit 200 || echo "import failed: $source"
          done
          autodoctor validate || true

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: source-inspection
          path: |
            inspection.txt
            data/reports/source-inspection.json
          if-no-files-found: warn

      - name: Open an issue when a source is missing
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Upstream source drift detected",
              body: "The scheduled upstream inspection failed. Check the workflow run for the " +
                    "source that changed shape or disappeared, then update its connector and " +
                    "its `config/sources.yaml` entry.",
            });
